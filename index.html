<head>
    <meta charset="UTF-8">

    <title>文字接龙游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.5s ease;
        }

        .level-1 { background-color: #e3f2fd; }
        .level-2 { background-color: #e8f5e9; }
        .level-3 { background-color: #fff3e0; }
        .level-4 { background-color: #fce4ec; }
        .level-5 { background-color: #f3e5f5; }
        .level-6 { background-color: #e8eaf6; }
        .level-7 { background-color: #e0f7fa; }
        .level-8 { background-color: #f1f8e9; }
        .level-9 { background-color: #fffde7; }
        .level-10 { background-color: #efebe9; }

        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 8px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .timer {
            color: #e74c3c;
        }

        .current-word {
            background-color: #f9f9f9;
            border-left: 4px solid #3498db;
            padding: 15px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
        }

        .word-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .word-text {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
            letter-spacing: 5px;
        }

        .last-char {
            color: #e74c3c;
        }

        .input-area {
            margin: 20px 0;
        }

        .input-label {
            display: block;
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
        }

        #user-input {
            width: 100%;
            padding: 12px 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
            text-align: center;
        }

        #user-input:focus {
            outline: none;
            border-color: #3498db;
        }

        #user-input.error {
            border-color: #e74c3c;
        }

        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 16px;
            display: none;
        }

        .message.error {
            background-color: #fdecea;
            color: #e74c3c;
            display: block;
        }

        .message.success {
            background-color: #edf7ed;
            color: #2ecc71;
            display: block;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #submit-btn {
            background-color: #3498db;
            color: white;
        }

        #submit-btn:hover {
            background-color: #2980b9;
        }

        #give-up-btn {
            background-color: #e74c3c;
            color: white;
        }

        #give-up-btn:hover {
            background-color: #c0392b;
        }

        #restart-btn {
            background-color: #f39c12;
            color: white;
        }

        #restart-btn:hover {
            background-color: #d68910;
        }

        .game-over {
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 10px;
            margin-top: 20px;
        }

        .game-over h2 {
            color: #e74c3c;
            margin-bottom: 10px;
        }

        .game-over.success h2 {
            color: #2ecc71;
        }

        .game-over p {
            font-size: 16px;
            color: #666;
            margin-bottom: 15px;
        }

        .start-screen {
            padding: 20px;
        }

        .start-screen h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .start-screen p {
            color: #666;
            margin-bottom: 10px;
            text-align: left;
        }

        .start-screen ul {
            text-align: left;
            margin: 15px 0;
            padding-left: 20px;
        }

        .start-screen li {
            color: #666;
            margin-bottom: 5px;
        }

        #start-btn {
            background-color: #2ecc71;
            color: white;
            margin-top: 20px;
        }

        #start-btn:hover {
            background-color: #27ae60;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="level-1">
    <div class="container">
        <!-- 开始界面 -->
        <div id="start-screen" class="start-screen">
            <h1>🎮 文字接龙游戏</h1>
            <h2>游戏规则</h2>
            <p>1. 系统随机生成一个2-3字的汉字词语作为起始词</p>
            <p>2. 你需要输入一个新词语，要求第一个字与上一个词语的最后一个字一致</p>
            <p>3. 每关有时间限制，超时或输入错误则游戏失败</p>
            <p>4. 共10关，每晋级一关，时间减少0.5秒</p>
            <button id="start-btn">开始游戏</button>
        </div>

        <!-- 游戏界面 -->
        <div id="game-screen" class="hidden">
            <h1>🎮 文字接龙</h1>
            
            <div class="game-info">
                <div class="info-item">
                    <span class="info-label">关卡</span>
                    <span class="info-value" id="level">1</span>
                </div>
                <div class="info-item">
                    <span class="info-label">剩余时间</span>
                    <span class="info-value timer" id="timer">10.0秒</span>
                </div>
                <div class="info-item">
                    <span class="info-label">接龙次数</span>
                    <span class="info-value" id="score">0</span>
                </div>
            </div>

            <div class="current-word">
                <div class="word-label">当前词语</div>
                <div class="word-text" id="current-word">
                    <span id="word-content">准备中...</span>
                </div>
            </div>

            <div class="input-area">
                <label class="input-label" for="user-input">
                    请输入以 "<span id="last-char" class="last-char"></span>" 开头的词语：
                </label>
                <input type="text" id="user-input" placeholder="请输入词语..." autocomplete="off">
                <div id="message" class="message"></div>
            </div>

            <div class="buttons">
                <button id="submit-btn">提交</button>
                <button id="give-up-btn">放弃游戏</button>
                <button id="restart-btn">重新开始</button>
            </div>
        </div>

        <!-- 游戏结束界面 -->
        <div id="game-over-screen" class="hidden game-over">
            <h2 id="game-over-title">游戏结束</h2>
            <p id="game-over-message"></p>
            <p id="final-score"></p>
            <button id="play-again-btn">再玩一次</button>
        </div>
    </div>

        const levelDisplay = document.getElementById('level');
        const timerDisplay = document.getElementById('timer');
        const scoreDisplay = document.getElementById('score');
        const currentWordDisplay = document.getElementById('word-content');
        const lastCharDisplay = document.getElementById('last-char');
        const messageDisplay = document.getElementById('message');
        const gameOverTitle = document.getElementById('game-over-title');
        const gameOverMessage = document.getElementById('game-over-message');
        const finalScore = document.getElementById('final-score');

        // 初始化
        function init() {
            startBtn.addEventListener('click', startGame);
            submitBtn.addEventListener('click', submitWord);
            giveUpBtn.addEventListener('click', giveUp);
            restartBtn.addEventListener('click', restartGame);
            playAgainBtn.addEventListener('click', restartGame);
            
            // 回车键提交
            userInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && gameActive) {
                    submitWord();
                }
            });
        }

        // 开始游戏
        function startGame() {
            startScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            gameOverScreen.classList.add('hidden');
            
            currentLevel = 1;
            score = 0;
            baseTime = 10;
            
            updateLevelBackground();
            generateRandomWord();
            startTimer();
            
            gameActive = true;
            userInput.focus();
        }

        // 生成随机词语
        function generateRandomWord() {
            const randomIndex = Math.floor(Math.random() * wordDatabase.length);
            currentWord = wordDatabase[randomIndex];
            updateWordDisplay();
        }

        // 更新词语显示
        function updateWordDisplay() {
            currentWordDisplay.textContent = currentWord;
            lastCharDisplay.textContent = currentWord.charAt(currentWord.length - 1);
            levelDisplay.textContent = currentLevel;
            scoreDisplay.textContent = score;
        }

        // 更新关卡背景颜色
        function updateLevelBackground() {
            document.body.className = `level-${currentLevel}`;
        }

        // 开始计时器
        function startTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            // 计算当前关卡时间：每关减少0.5秒
            timeLeft = baseTime - (currentLevel - 1) * 0.5;
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    timeUp();
                }
            }, 100);
        }

        // 更新计时器显示
        function updateTimerDisplay() {
            timerDisplay.textContent = timeLeft.toFixed(1) + '秒';
            
            // 时间少于3秒时变红
            if (timeLeft < 3) {
                timerDisplay.style.color = '#e74c3c';
            } else {
                timerDisplay.style.color = '#e74c3c';
            }
        }

        // 时间到
        function timeUp() {
            clearInterval(timerInterval);
            gameActive = false;
            showMessage('时间到！接龙失败，请重新输入', 'error');
            setTimeout(() => {
                endGame(false);
            }, 1500);
        }

        // 提交词语
        function submitWord() {
            if (!gameActive) return;
            
            const input = userInput.value.trim();
            
            // 验证输入
            if (!input) {
                showMessage('请输入词语！', 'error');
                userInput.classList.add('error');
                setTimeout(() => {
                    userInput.classList.remove('error');
                }, 1000);
                return;
            }
            
            // 验证是否为2-3字词语
            if (input.length < 2 || input.length > 3) {
                showMessage('请输入2-3字的词语！', 'error');
                userInput.classList.add('error');
                setTimeout(() => {
                    userInput.classList.remove('error');
                }, 1000);
                return;
            }
            
            // 验证首字是否匹配
            const lastChar = currentWord.charAt(currentWord.length - 1);
            const firstChar = input.charAt(0);
            
            if (firstChar !== lastChar) {
                showMessage(`接龙失败！请输入以"${lastChar}"开头的词语`, 'error');
                userInput.classList.add('error');
                setTimeout(() => {
                    userInput.classList.remove('error');
                }, 1000);
                return;
            }
            
            // 验证词语是否在数据库中
            if (!wordDatabase.includes(input)) {
                showMessage('该词语不在词库中，请重新输入！', 'error');
                userInput.classList.add('error');
                setTimeout(() => {
                    userInput.classList.remove('error');
                }, 1000);
                return;
            }
            
            // 词语验证通过
            score++;
            currentWord = input;
            userInput.value = '';
            showMessage('接龙成功！继续加油！', 'success');
            
            // 检查是否需要升级关卡
            if (score % 5 === 0) {
                if (currentLevel < 10) {
                    currentLevel++;
                    updateLevelBackground();
                    showMessage(`恭喜！升级到第${currentLevel}关！`, 'success');
                } else if (currentLevel === 10) {
                    // 已经是第10关，检查是否通关
                    if (score >= 50) {
                        clearInterval(timerInterval);
                        endGame(true);
                        return;
                    }
                }
            }
            
            updateWordDisplay();
            startTimer();
            userInput.focus();
        }

        // 显示消息
        function showMessage(text, type) {
            messageDisplay.textContent = text;
            messageDisplay.className = 'message ' + type;
            
            setTimeout(() => {
                messageDisplay.className = 'message';
                messageDisplay.style.display = 'none';
            }, 2000);
        }

        // 放弃游戏
        function giveUp() {
            if (!gameActive) return;
            
            clearInterval(timerInterval);
            gameActive = false;
            endGame(false);
        }

        // 重新开始游戏
        function restartGame() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            gameActive = false;
            messageDisplay.className = 'message';
            messageDisplay.style.display = 'none';
            userInput.value = '';
            
            startGame();
        }

        // 结束游戏
        function endGame(isWin) {
            clearInterval(timerInterval);
            gameActive = false;
            
            gameScreen.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            
            if (isWin) {
                gameOverScreen.classList.add('success');
                gameOverTitle.textContent = '🎉 恭喜通关！';
                gameOverMessage.textContent = '你已经完成了全部10关！真是太厉害了！';
            } else {
                gameOverScreen.classList.remove('success');
                gameOverTitle.textContent = '😢 游戏结束';
                gameOverMessage.textContent = '不要灰心，再试一次吧！';
            }
            
            finalScore.textContent = `最终成绩：第${currentLevel}关，成功接龙${score}次`;
        }

        // 初始化游戏
        init();
    </script>
</body>
</html>
